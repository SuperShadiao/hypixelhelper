                var hdr = document.querySelector('header');
                var ftr = document.querySelector('footer');
                app.style.top = (hdr ? hdr.offsetHeight : 70) + 'px';
                // 依据页脚实际位置计算底部留白，避免与页脚重叠
                var gap = 0;
                if (ftr && getComputedStyle(ftr).display !== 'none') {
                    gap = window.innerHeight - ftr.getBoundingClientRect().top;
                    if (gap < 0) gap = 0;
                }
                app.style.bottom = gap + 'px';
            }

            // ---------- 与本地模组的 WebSocket 桥 ----------
            // 运行模式由 URL 查询参数决定：
            //   ?port=841  → 连接 ws://localhost:841，保存按钮把节点图回传给模组落盘
            //   无 port    → 纯离线模式：不发起任何本地请求，保存按钮改为下载 JSON 文件
            var NG_PORT = (new URLSearchParams(location.search).get('port') || '').trim();
            var wsMode = !!NG_PORT;
            var NG_WS_URL = wsMode ? ('ws://localhost:' + NG_PORT) : '';
            var ngWs = null, ngWsTimer = null, ngWsWarned = false;

            function ngWsSend(obj) {
                if (!ngWs || ngWs.readyState !== 1) return false;
                try { ngWs.send(JSON.stringify(obj)); return true; }
                catch (e) { return false; }
            }

            function ngWsConnect() {
                if (!wsMode) return;   // 未指定 ?port=，离线模式不连接本地
                if (ngWs && (ngWs.readyState === 0 || ngWs.readyState === 1)) return;
                try { ngWs = new WebSocket(NG_WS_URL); }
                catch (e) { ngWsScheduleReconnect(); return; }

                ngWs.onopen = function () {
                    ngWsWarned = false;
                    log('已连接本地模组 ' + NG_WS_URL + '（扩展自动载入 / 保存回写 / 错误同步已启用）', 'ok');
                    ngWsSend({ type: 'hello' });
                };
                ngWs.onmessage = function (ev) {
                    var msg;
                    try { msg = JSON.parse(ev.data); } catch (e) { return; }
                    if (msg.type === 'extensions') {
                        var n = 0;
                        (msg.data || []).forEach(function (ext) {
                            // 持久化：刷新后能在载入节点图之前恢复，避免扩展节点被当成未知类型丢弃
                            try { applyExtension(ext, { imported: true }); n++; }
                            catch (e) { log('⚠ 模组扩展载入失败：' + e.message, 'warn'); }
                        });
                        renderPalette();
                        bindPaletteEvents();
                        log(n ? ('已从模组自动载入 ' + n + ' 个扩展包。') : '模组扩展目录里暂无扩展包。', n ? 'ok' : 'warn');
                    } else if (msg.type === 'graphs') {
                        var names = msg.data || [];
                        if (names.length) log('模组里已有节点图：' + names.join('、'), 'ok');
                    } else if (msg.type === 'load_graph') {
                        applyRemoteGraph(msg);
                    } else if (msg.type === 'saved') {
                        log('已写入模组：' + (msg.file || msg.name) + '（Java 层已热载入）', 'ok');
                    } else if (msg.type === 'deleted') {
                        log('模组回执：节点图「' + msg.name + '」' + (msg.existed ? '文件已删除。' : '文件本就不存在。'), 'ok');
                    } else if (msg.type === 'error') {
                        applyExternalError(msg.data || msg);   // 出错节点标红 + 执行轨迹黄绿
                        log('已收到模组推送的执行错误，正在图上高亮。', 'warn');
                    }
                };
                ngWs.onclose = function () { ngWs = null; ngWsScheduleReconnect(); };
                ngWs.onerror = function () { /* 交给 onclose 重连 */ };
            }

            // 没连上就每 60 秒再试一次；一旦连上就不再重试（断开后恢复 60 秒轮询）
            function ngWsScheduleReconnect() {
                if (!wsMode) return;
                if (ngWsTimer) return;
                if (!ngWsWarned) {
                    ngWsWarned = true;
                    log('暂未连接到本地模组，之后每 60 秒重试一次。', 'warn');
                }
                ngWsTimer = setTimeout(function () { ngWsTimer = null; ngWsConnect(); }, 60000);
            }

            // ---------- 初始化 ----------
            window.headerLoadedCallback = function () {
                if (initialized) return;
                initialized = true;

                // header.js 重建 body 之后, 必须重新获取元素引用并绑定事件
                initDom();
                bindCanvasEvents();
                bindInspectorEvents();
                bindToolbarEvents();

                // 页头/页脚样式与图片异步加载, 多测几次确保高度准确
                layoutChrome();
                var frames = 0;
                (function poll() {
                    layoutChrome();
                    if (++frames < 40) requestAnimationFrame(poll);
                })();
                setTimeout(layoutChrome, 800);
                setTimeout(layoutChrome, 1600);
                window.addEventListener('resize', layoutChrome);

                applyTransform();

                // 先加载扩展包（节点定义），再渲染左侧列表、绑定事件并载入示例
                loadExtension(EXT_URL).then(function () {
                    EXTS.forEach(function (e) {
                        log('已加载内置扩展：' + e.name + (e.version ? ' v' + e.version : '') + '（' + e.count + ' 个节点类型）', 'ok');
                    });
                }).catch(function (err) {
                    log('⚠ 内置扩展加载失败：' + err.message + '（本页需通过 http 服务器访问）', 'warn');
                }).then(function () {
                    var n = restoreExtensions();
                    if (n) log('已从本地恢复 ' + n + ' 个导入的扩展，无需重新导入。', 'ok');
                    renderPalette();
                    bindPaletteEvents();
                    // 进入页面时文件名是空的，自动恢复本地草稿没有意义：
                    // 留空画布，由文件名框回车从模组按名字载入，或点「示例」快速开始。
                    lastSavedJson = contentSnapshot();
                    updateFileStatus();
                    if (wsMode) {
                        log('画布为空：在文件名框填写名字并回车可从模组读取节点图，或点「示例」快速开始。', 'ok');
                        ngWsConnect();   // 主动连接本地模组 ws://localhost:<port>
                    } else {
                        log('未指定 ?port=，已进入离线模式：不连接本地模组，保存将直接下载 JSON 文件。', 'ok');
                    }
                });
            };
        })();
    </script>
</body>
