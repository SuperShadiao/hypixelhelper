        href="/datagetter?url=https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <script src="/sitesources/js/header.js" defer></script>

    <style>
        #qqgroupmemberverify-content {
            max-width: 600px;
            margin: 0 auto;
            width: calc(100vw - 40px);
        }

        #result {
            text-align: center;
        }

        #result h3 {
            margin: 20px auto;
            max-width: 90%;
            word-wrap: break-word;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .verify-btn {
            margin-bottom: 15px;
            display: block;
            margin: 0 auto;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FFE34F 0%, #FFB300 100%);
            color: #3a2a00;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: box-shadow 0.3s, transform 0.2s, filter 0.3s;
            box-sizing: border-box;
            box-shadow: 0 4px 18px rgba(255, 179, 0, 0.45), 0 1px 3px rgba(255, 179, 0, 0.3);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .verify-btn:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 179, 0, 0.55), 0 2px 6px rgba(255, 179, 0, 0.35);
        }

        .verify-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .verify-btn.click-anim {
            animation: clickFade 0.25s ease-out forwards;
        }

        .verify-btn.click-anim::after {
            animation: ripple 0.25s ease-out forwards;
        }

        #turnstile-widget {
            margin: 0 auto;
            display: block;
            text-align: center;
            max-width: 400px;
        }

        @keyframes clickFade {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            30% {
                transform: translateY(2px) scale(0.95);
                opacity: 1;
            }

            100% {
                transform: translateY(-6px) scale(0.92);
                opacity: 0;
            }
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                width: 320px;
                height: 320px;
                opacity: 0;
            }
        }

        .Toastify__toast {
            border-radius: 12px;
            font-family: inherit;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .Toastify__toast--animated {
            animation: toastSlideIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) both;
        }

        .Toastify__toast-icon {
            margin-inline-end: 10px;
        }

        .Toastify__close-button {
            color: #fff;
            opacity: 0.8;
        }

        .Toastify__close-button:hover {
            opacity: 1;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateX(400px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
